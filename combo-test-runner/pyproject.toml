[project]
name = "combo-test-runner"
version = "0.1.0"
description = "Combinatorial pytest runner for cece_standalone_driver"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
