# Test-suite configuration (see design/design.md).
# config_path names the base CECE driver config; relative paths resolve
# against this file's directory (or CECE_CONFIG_SEARCH_PATH when set).
# Each sweep key names an enum dimension from src/models/cece_config.py; the
# combination space is the cartesian product of the listed values. Enums
# absent from `sweep` are not swept and stay at their base-config values.
config_path: ../cece/simple-maccity.yaml
timeout_s: 10  # per combination; capped by CECE_RUN_TIMEOUT_S when that is smaller
assertions:
  expected_nc_file_count: null  # null = derive from the combo config
  # Known driver bug: output is stamped at hour 0 instead of hour 1, so the
  # test_nc_filenames tests are EXPECTED TO FAIL until the driver is fixed.
  validate_filenames: true
analysis:
  compute_descriptive_stats: true  # default; false skips test_descriptive_stats
sweep:
  mapalgo: [bilinear, consd, passthrough]
