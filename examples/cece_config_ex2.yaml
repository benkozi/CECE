# Regional masking example with European focus.
#
# Data note: the regional stream originally used EMEP data, which is not
# available in the public geos-chem bucket; it now uses CEDS 1970 CO
# (energy sector) — the lesson (hierarchy + mask-scoped replace) is
# unchanged. The mask file is a Canada mask reused as a stand-in regional
# mask.
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-01T02:00:00"
  timestep_seconds: 3600
  grid:
    nx: 8
    ny: 6
    lon_min: -20.0
    lon_max: 40.0
    lat_min: 35.0
    lat_max: 70.0

meteorology:
  mask_europe: MASK_EUROPE

temporal_profiles:
  diurnal_traffic:
    [
      0.5,
      0.3,
      0.2,
      0.3,
      0.6,
      1.2,
      1.8,
      1.5,
      1.2,
      1.0,
      1.1,
      1.2,
      1.3,
      1.2,
      1.3,
      1.5,
      1.8,
      2.0,
      1.8,
      1.5,
      1.2,
      1.0,
      0.8,
      0.6,
    ]

species:
  co:
    - field: "MACCITY_CO"
      category: "anthropogenic"
      hierarchy: 1
      operation: "add"
      diurnal_cycle: "diurnal_traffic"
    - field: "CEDS_CO"
      category: "anthropogenic"
      hierarchy: 2
      operation: "replace"
      mask: "mask_europe"

cece_data:
  streams:
    - name: "MACCITY_CO"
      file: "/work/data/MACCity_4x5.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "MACCity"
          model: "MACCITY_CO"
    - name: "CEDS_CO"
      file: "/work/data/CO-em-total-anthro_CEDS_1970.nc"
      yearFirst: 1970
      yearLast: 1970
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "CO_ene"
          model: "CEDS_CO"
    - name: "MASK_EUROPE"
      file: "/work/data/Canada_mask.gen.1x1.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "MASK"
          model: "MASK_EUROPE"

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex2_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: co
      attributes:
        units: "kg m-2 s-1"
        long_name: "carbon_monoxide_emission_flux"
