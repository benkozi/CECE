# Cadence-aware temporal scale factors + AMIO worker threads.
#
# Like ex1 (multi-sector NO with temporal scale factors) but demonstrating
# explicit stream `cadence` handling and `amio_worker_threads`.
#
# Data note: sector emissions come from HTAPv3 (the successor to the
# EDGAR-HTAP v2015-03 files this example originally used, which are not
# publicly downloadable). HTAPv3 packs the sectors as variables of one
# monthly file per year, so all five sector streams read
# /work/data/HTAPv3_NO_0.1x0.1_2010.nc (fetched by
# scripts/data_download/download_ex7.sh) and carry the monthly cadence.
#
# The CAMS-TEMPO v3.1 temporal weights are NOT yet publicly downloadable:
# the download script's CAMS fetches point at aspirational geos-chem-bucket
# keys and are EXPECTED TO FAIL until a public source is found, so this
# example currently fails on the missing /work/data/CAMS-*.nc inputs.
# The datasets are deliberately not substituted.
driver:
  start_time: "2010-01-01T00:00:00"
  end_time: "2010-01-01T23:00:00"
  timestep_seconds: 3600
  # Optional: write run output to this log file instead of using `> cece.log`.
  # Output is tee'd, so it also still appears on the console.
  log_file: "cece.log"
  # KNOWN DRIVER BUG (2026-07-20, unfixed here — no src changes): any value
  # >= 2 segfaults during stream ingest on this example; 1 runs correctly.
  # Reported in the combo-test-runner examples report.
  amio_worker_threads: 1
  grid:
    grid_name: "F360"
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

meteorology: {}

temporal_profiles:
  diurnal_traffic:
    [
      0.5,
      0.3,
      0.2,
      0.3,
      0.6,
      1.2,
      1.8,
      1.5,
      1.2,
      1.0,
      1.1,
      1.2,
      1.3,
      1.2,
      1.3,
      1.5,
      1.8,
      2.0,
      1.8,
      1.5,
      1.2,
      1.0,
      0.8,
      0.6,
    ]

species:
  nox:
    - field: "HTAP_TRANSPORT_NO"
      operation: "add"
      scale: 1.0
      scale_fields: ["CAMS_HOURLY", "CAMS_WEEKLY", "CAMS_MONTHLY"]
    - field: "HTAP_SHIPS_NO"
      operation: "add"
    - field: "HTAP_RESIDENTIAL_NO"
      operation: "add"
    - field: "HTAP_INDUSTRY_NO"
      operation: "add"
      # CAMS-TEMPO only provides a MONTHLY temporal profile for the industry
      # sector (no hourly/weekly industry weights exist in the dataset).
      scale_fields: ["CAMS_MONTHLY_ind"]
    - field: "HTAP_ENERGY_NO"
      operation: "add"

cece_data:
  streams:
    # All five sector streams read the same HTAPv3 file; the sectors are
    # variables (NO_TRA, NO_SHP, NO_RCO, NO_IND, NO_ENE) of its 12 monthly
    # records — hence the explicit monthly cadence.
    - name: "HTAP_NO_TRANSPORT"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2010.nc"
      yearFirst: 2010
      yearLast: 2010
      yearAlign: 2010
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "NO_TRA"
          model: "HTAP_TRANSPORT_NO"
    - name: "HTAP_NO_SHIPS"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2010.nc"
      yearFirst: 2010
      yearLast: 2010
      yearAlign: 2010
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "NO_SHP"
          model: "HTAP_SHIPS_NO"
    - name: "HTAP_NO_RESIDENTIAL"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2010.nc"
      yearFirst: 2010
      yearLast: 2010
      yearAlign: 2010
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "NO_RCO"
          model: "HTAP_RESIDENTIAL_NO"
    - name: "HTAP_NO_INDUSTRY"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2010.nc"
      yearFirst: 2010
      yearLast: 2010
      yearAlign: 2010
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "NO_IND"
          model: "HTAP_INDUSTRY_NO"
    - name: "HTAP_NO_ENERGY"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2010.nc"
      yearFirst: 2010
      yearLast: 2010
      yearAlign: 2010
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "NO_ENE"
          model: "HTAP_ENERGY_NO"
    # CAMS-TEMPO weights: not publicly downloadable yet (see header note);
    # these streams keep the original dataset and fail until data exists.
    - name: "CAMS_HOURLY"
      file: "/work/data/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_hourly_fixtime_utc.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Discrete hour-of-day profile (24 records): pick the record matching the
      # current simulation hour. Interpolation is not meaningful for of-day
      # weights, so nearest is used regardless of tintalgo.
      cadence: "hourly"
      tintalgo: "nearest"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FH_weekday_tro"
          model: "CAMS_HOURLY"
    - name: "CAMS_WEEKLY"
      file: "/work/data/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_weekly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Discrete day-of-week profile (7 records): pick the record matching the
      # current simulation day of week. Always nearest.
      cadence: "weekly"
      tintalgo: "nearest"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FW_tro"
          model: "CAMS_WEEKLY"
    - name: "CAMS_MONTHLY"
      file: "/work/data/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_monthly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Continuous monthly climatology (12 records). With tintalgo=linear the
      # value is interpolated to the current day using the mid-month convention
      # (e.g. Jan 1 blends the Dec and Jan records).
      cadence: "monthly"
      tintalgo: "linear"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FM_tro"
          model: "CAMS_MONTHLY"
    - name: "CAMS_MONTHLY_ind"
      file: "/work/data/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_monthly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      cadence: "monthly"
      tintalgo: "linear"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FM_ind"
          model: "CAMS_MONTHLY_ind"

diagnostics:
  output_interval_seconds: 3600
  variables: ["nox"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex7_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: nox
      attributes:
        units: "kg m-2 s-1"
        long_name: "nitrogen_oxides_emission_flux"
