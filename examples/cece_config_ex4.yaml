# High-resolution inventory example: 0.1-degree HTAPv3 shipping NO
# regridded to a coarse grid over a full day.
#
# Note: this example previously declared physics_schemes "GFED" and
# "DayCycleAndSeasonVariation", neither of which is a registered scheme —
# the driver aborted on them. Physics-scheme demonstrations live in
# cece_config_advanced.yaml and cece_config_megan3.yaml, which use real
# registered schemes with the met inputs they require.
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-02T00:00:00"
  timestep_seconds: 3600
  grid:
    nx: 6
    ny: 4
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  no:
    - field: "HTAP_NO"
      operation: "add"

cece_data:
  streams:
    - name: "HTAP_NO"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2018.nc"
      yearFirst: 2018
      yearLast: 2018
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "NO_SHP"
          model: "HTAP_NO"

diagnostics:
  output_interval_seconds: 3600
  variables: ["no"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex4_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - no
